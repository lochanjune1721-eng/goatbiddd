<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fans — GOAT.lol</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div><nav class="topnav"><a href="index.html">Categories</a><a href="fans.html" class="active">Fans</a><span id="balance-pill" class="balance-pill"></span></nav></div></header>
<div class="container" style="padding:20px">
  <h1 class="display" style="font-size:32px">Top backers</h1>
  <p class="mono" style="font-size:12px;color:var(--muted)">Global leaderboard of the biggest backers — handles and totals. Status people will chase.</p>
  <div id="fans" class="list" style="margin-top:12px"></div>
</div>
<script src="js/supabase.js"></script>
<script>
(async function(){
  const sb=window.supabaseClient;
  const {data: users}=await sb.from('users').select('display_name,is_anonymous,total_spent_cents,photo_path,social_handle,social_platform').order('total_spent_cents',{ascending:false}).limit(100);
  const el=document.getElementById('fans');
  if(!users||!users.length){ el.innerHTML='<div class="empty">No backers yet.</div>'; return; }
  el.innerHTML=users.map((u,i)=>{
    const initials=window.GOAT.initials(u.is_anonymous?'Anonymous':u.display_name||'Unknown');
    const photo = u.photo_path ? `<img src="${window.GOAT.getPhotoUrl(u.photo_path)||u.photo_path}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">` : `<div style="width:44px;height:44px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;color:var(--gold);font-family:Anton,sans-serif">${initials}</div>`;
    const handle = u.social_handle ? `<span style="font-size:11px;color:var(--muted)">@${u.social_handle.replace(/^@/,'')} · ${u.social_platform||''}</span>` : '';
    return `<div class="job-card" style="display:flex;gap:12px;align-items:center"><span style="font-family:JetBrains Mono,monospace;color:var(--muted);width:28px">#${i+1}</span><div style="width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto">${photo}</div><div style="flex:1;min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.is_anonymous?'Anonymous':u.display_name||'Unknown'}</div><div>${handle||'<span style="color:var(--muted);font-size:11px">—</span>'}</div></div><b class="display" style="color:var(--gold)">${window.GOAT.votes(u.total_spent_cents||0)}</b></div>`;
  }).join('');
})();
</script>
</body>
</html>
