<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Fans — The True GOAT</title>
<meta name="description" content="Global leaderboard of top backers on The True GOAT — rankings, money down, and status.">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="/">The True<span> GOAT</span></a></div>
  <nav class="topnav"><a href="/">Categories</a><a href="/fans" class="active">Fans</a><a href="/about">About</a><span id="balance-pill" class="balance-pill"></span></nav>
</div></header>
<div class="container" style="max-width:760px;padding:24px 20px">
  <h1 class="display" style="font-size:36px;letter-spacing:.02em">Top Backers</h1>
  <p class="mono" style="font-size:12px;color:var(--muted);margin:6px 0 16px">Global leaderboard of the biggest backers on The True GOAT.</p>
  <div id="fans" class="list">
    <div class="skeleton" style="height:64px;border-radius:12px"></div>
    <div class="skeleton" style="height:64px;border-radius:12px;margin-top:8px"></div>
    <div class="skeleton" style="height:64px;border-radius:12px;margin-top:8px"></div>
  </div>
</div>
<footer class="footer">The True GOAT — pay to rank. <a href="/rules">Rules</a> · <a href="/wallet">Wallet</a> · <a href="/fans">Fans</a></footer>
<script src="js/supabase.js"></script>
<script src="js/profile.js"></script>
<script src="js/checkout.js"></script>
<script>
(async function(){
  const el = document.getElementById('fans');
  try {
    const res = await fetch('/api/fans');
    const json = await res.json().catch(()=>({fans:[]}));
    const activeUsers = json.fans || [];
    if(!activeUsers.length){ 
      el.innerHTML='<div class="empty">No backers on the board yet. Back a contender to claim the #1 spot!</div>'; 
      return; 
    }

    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = activeUsers.map((u,i)=>{
      const name = u.is_anonymous ? 'Anonymous' : (u.display_name||'Unknown');
      const initials = window.GOAT.initials(name);
      const photoUrl = u.photo_path ? (window.GOAT.getPhotoUrl(u.photo_path)||u.photo_path) : null;
      const photo = photoUrl ? `<img src="${photoUrl}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">` : `<div style="width:48px;height:48px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;color:var(--gold);font-family:Anton,sans-serif;font-size:16px">${initials}</div>`;
      
      const supporting = u.social_handle ? '@'+u.social_handle.replace(/^@/,'') : 'Leading backer';
      const rankLabel = i < 3 ? medals[i] : `#${i+1}`;

      return `<div class="job-card" style="display:flex;gap:14px;align-items:center;padding:14px;${i===0?'border-color:var(--gold);background:linear-gradient(180deg, var(--gold-lo) 0%, var(--surface) 60%);':''}">
        <span style="font-family:JetBrains Mono,monospace;color:var(--muted);width:32px;font-size:14px;font-weight:700;text-align:center">${rankLabel}</span>
        <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;flex:0 0 auto">${photo}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}${i===0?' <span style="font-size:11px;color:var(--gold);font-weight:700;margin-left:4px">👑 #1 Backer</span>':''}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${supporting}</div>
        </div>
        <b class="display" style="color:var(--gold);font-size:18px">${window.GOAT.money(u.total_spent_cents||0)}</b>
      </div>`;
    }).join('');
  } catch(e){
    el.innerHTML = '<div class="empty">Error loading backers.</div>';
  }
})();
</script>
</body>
</html>
