<link rel="preconnect" href="https://orzcszqpnvicreqvpncu.supabase.co" crossorigin>

<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="/">The True<span> GOAT</span></a></div>
  <div class="search"><i>⌕</i><input id="search" placeholder="Search people, categories"></div>
  <nav class="topnav"><a href="/">Categories</a><a href="/fans">Fans</a><a href="/about">About</a><span id="balance-pill" class="balance-pill"><a href="/wallet">Sign in</a></span></nav>
</div></header>

<div class="container" style="padding:16px 20px">
  <div id="cat-head" style="margin:12px 0">
    <h1 id="cat-title" class="display" style="font-size:36px;letter-spacing:.02em">—</h1>
    <div class="mono" style="font-size:12px;color:var(--muted)">Rank is the money. Nothing else. <a href="/rules" style="color:var(--gold);text-decoration:underline">Rules →</a></div>
  </div>

  <div style="display:flex;gap:8px;margin:10px 0">
    <input id="add-name" placeholder="Add a person — real public figure with Wikipedia" style="flex:1;height:42px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--ink);padding:0 14px">

  <div id="pagination" class="pagination"></div>
</div>
<div class="sticky-bar" id="sticky-bar">
  <span class="balance"><span id="sticky-balance">—</span></span>
  <a href="/wallet" class="btn-primary" style="padding:8px 14px">Add credit</a>
</div>
<footer class="footer">The True GOAT — pay to rank. <a href="/rules">Rules</a> · <a href="/wallet">Wallet</a> · <a href="/fans">Fans</a></footer>

<script src="js/supabase.js"></script>
<script src="js/checkout.js"></script>
<script src="js/profile.js"></script>
<script src="js/back-control.js"></script>
<script src="js/video-manager.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/portrait-fallback.js"></script>
<script src="js/canonical-order.js"></script>
<script src="js/country-boards.js"></script>
<script src="js/video-hover.js?v=single_audio_v5"></script>
<script src="js/wiki-fallback.js"></script>
<script>
(async function(){
  // Contender names reach this page from add_person, which any signed-in
  // visitor can call, so nothing derived from one goes into markup unescaped.
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slug=window.GOAT.qs('slug')||'footballers';
  const sb=window.supabaseClient;
  let {data: cat}=await sb.from('categories').select('*').eq('slug',slug).maybeSingle();

  // Country boards ship as JSON (data/boards/<CC>.json) and only enter the
  // database once data/country-boards-seed.sql has been run. Until then, read
  // the board straight from the file so it is browsable — but without ids there
  // is nothing to vote on, so the page goes read-only rather than offering
  // controls that cannot work.
  let previewOnly=false;
  if(!cat && window.CountryBoards){
    const hit=await window.CountryBoards.boardBySlug(slug);
    if(hit){
      previewOnly=true;
      document.body.classList.add('preview-only');
      cat={ id:'cb-'+slug, slug, name:hit.board.name.replace(/^Greatest\s+/i,''),
            country_code:hit.code, __board:hit.board };
    }
  }
  if(!cat){ document.getElementById('cat-title').textContent='Category not found'; return; }
  document.getElementById('cat-title').textContent='Greatest ' + cat.name + ' of All Time';
  document.title='Greatest ' + cat.name + ' of All Time — The True GOAT';
  let people=[];
  let optimisticQueue=[];
  // Every board is a top 20: 147 categories x 20 is the canonical set in
  // data/thetruegoat_147_categories_top20.csv. Ranking is by votes, so a
  // contender below 20th drops off the board until enough votes carry them back.
  const BOARD_SIZE = 20;
  const FETCH_SIZE = 200;   // over-fetch, then rank canonically and trim to 20

  // Put the board in canonical order and cut it to 20. Votes still win; the
  // canonical rank only decides contenders that are level (which, at zero
  // votes, is all of them). Unknown categories keep the database order.
  async function applyCanonical(list){
    if(!window.CanonicalOrder || !list || !list.length) return (list||[]).slice(0, BOARD_SIZE);
    try { return await window.CanonicalOrder.apply(list, cat, BOARD_SIZE); }
    catch(e){ console.warn('canonical ordering skipped', e); return list.slice(0, BOARD_SIZE); }
  }

  async function fetchPeople(){
    if(previewOnly){
      people=window.CountryBoards.asPeople(cat.__board, cat.country_code).slice(0, BOARD_SIZE);
      return;
    }
    const {data}=await sb.from('people').select('*').eq('category_id', cat.id).order('total_cents',{ascending:false}).order('first_backed_at',{ascending:true,nullsFirst:false}).order('seed_rank',{ascending:true,nullsFirst:false}).limit(FETCH_SIZE);
    const rawList = data||[];
    
    // Deduplicate any duplicates from database
    const seen = new Set();
    people = [];
    for(const p of rawList){
      if(!p || !p.name) continue;
      const key = p.name.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
      if(seen.has(key)) continue;
      seen.add(key);
      people.push(p);
    }

    if(!people.length){
      const fb=await window.WIKI_FALLBACK?.();
      if(fb){
        const raw=fb.people.filter(p=> p.category_slug===slug);
        people=raw.map(p=>({id:p.id, slug:p.slug, name:p.name, blurb:p.blurb, wikipedia_url:p.wikipedia_url, photo_path:p.photo_path, total_cents:0, first_backed_at:null, category_id:cat.id}));
      }
    }
    // one application point, so the offline fallback is ordered too
    people=await applyCanonical(people);
  }

  async function fetchFansDetailed(personIds){
    if(previewOnly || !personIds.length) return {};
    // fetch top 2 per person to compute gap
    const {data}=await sb.from('fan_totals').select('person_id,total_cents,users(id,display_name,is_anonymous,photo_path,social_handle,social_platform,photo_status)').in('person_id', personIds).order('total_cents',{ascending:false});
    const map={};
    (data||[]).forEach(r=>{
      if(!map[r.person_id]) map[r.person_id]=[];
      if(map[r.person_id].length<2) map[r.person_id].push(r);
    });
    return map;
  }

  function rankClass(r){
    if(r===1) return 'rank-1';
    if(r===2) return 'rank-2';
    if(r===3) return 'rank-3';
    if(r<=10) return 'rank-4-10';
    return 'rank-11-plus';
  }
  // The board speaks in dollars; the vote is what the dollar buys, not the score.
  function fmtVotes(c){ return '$' + Math.floor((c||0)/100).toLocaleString('en-US'); }
  function platformIcon(p){
    if(p==='x') return '𝕏';
    if(p==='instagram') return '◎';
    if(p==='tiktok') return '♫';
    if(p==='youtube') return '▶';
    return '';
  }

  // The order the database uses, mirrored here so an optimistic re-sort after a
  // vote does not disagree with the next fetch: money, then who got there
  // first, then the curated seed order for a board nobody has backed yet.
  function boardOrder(a,b){
    const money = (b.total_cents||0) - (a.total_cents||0);
    if(money) return money;
    const fa = a.first_backed_at ? Date.parse(a.first_backed_at) : Infinity;
    const fb = b.first_backed_at ? Date.parse(b.first_backed_at) : Infinity;
    if(fa !== fb) return fa - fb;
    return (a.seed_rank ?? Infinity) - (b.seed_rank ?? Infinity);
  }

  // Share of every vote cast on this board — the same number the duel shows, so
  // a contender reads the same way whichever surface you meet them on.
  function boardTotalCents(){ return people.reduce((n,x)=> n + (x.total_cents||0), 0); }
  function sharePct(p){
    const all = boardTotalCents();
    if(!all) return 0;
    return Math.round(((p.total_cents||0) / all) * 1000) / 10;
  }
  // "Cristiano Ronaldo" -> "Ronaldo". A long surname falls back to the given
  // name so the button never wraps.
  function shortName(full){
    const parts=String(full||'').trim().split(/\s+/).filter(Boolean);
    if(parts.length<2) return parts[0]||'';
    const last=parts[parts.length-1];
    return last.length>12 ? parts[0] : last;
  }

  async function render(){
    const board=document.getElementById('board');
    if(!people.length){
      board.innerHTML='<div class="empty">Nothing backed yet. $1 takes #1.</div>';
      return;
    }
    const fanMap=await fetchFansDetailed(people.map(p=>p.id));
    board.innerHTML='';

    people.forEach((p,i)=>{
      const rank=i+1, cls=rankClass(rank);
      const fans=fanMap[p.id]||[];
      const topFan=fans[0]||null;
      const nextFan=fans[1]||null;
      const gapAhead = rank>1 ? Math.floor(((people[0].total_cents||0) - (p.total_cents||0))/100) : null;
      const gapVotesBehind = rank===1 && people[1] ? Math.floor(((p.total_cents||0)-(people[1].total_cents||0))/100) : null;
      const gapText = rank===1
        ? (gapVotesBehind!==null ? `$${gapVotesBehind.toLocaleString('en-US')} ahead of #2` : 'Nothing backed yet. $1 takes #1.')
        : `$${Math.abs(gapAhead).toLocaleString('en-US')} behind #1`;

      const photoHtml = window.PortraitFallback.photoHtml(p, rank===1?220: rank===2?160: rank===3?130:90, {eager: i<3});

      // fan side
      let fanHtml='';
      if(topFan){
        const u=topFan.users||{};
        const fanName = u.display_name || 'A backer';
        const handle = u.social_handle ? `<a href="https://${u.social_platform==='x'?'x.com': u.social_platform+'.com'}/${encodeURIComponent(u.social_handle.replace(/^@/,'') )}" target="_blank" rel="noopener">${u.social_handle.startsWith('@')?u.social_handle:'@'+u.social_handle} ${platformIcon(u.social_platform)}</a>` : '';
        // A fan's face is in the avatars bucket, not the contender bucket that
        // OptimizedImage resolves against — routing it through there 404'd every
        // uploaded avatar and fell back to initials.
        const fanUrl = window.GOAT.getAvatarUrl(u.photo_path);
        const fanPhoto = fanUrl
          ? `<img src="${fanUrl}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fan-initials',textContent:${JSON.stringify(window.GOAT.initials(fanName))}}))">`
          : `<div class="fan-initials">${window.GOAT.initials(fanName)}</div>`;
        const fanVotes = fmtVotes(topFan.total_cents);
        const fanGap = nextFan ? `$${Math.floor((topFan.total_cents - nextFan.total_cents)/100).toLocaleString('en-US')} ahead of the next fan` : 'Only fan so far';
        fanHtml = `
          <div class="fan-photo">${fanPhoto}</div>
          <div class="fan-meta">
            <div class="fan-name">${fanName}</div>
            ${handle?`<div class="fan-handle">${handle}</div>`:''}
            <div class="fan-votes">GOAT fan · ${fanVotes}</div>
            <div class="fan-gap">${fanGap}</div>
          </div>`;
      } else {
        fanHtml = `
          <div class="fan-photo"><div class="fan-initials">?</div></div>
          <div class="fan-meta">
            <div class="fan-name" style="color:var(--muted)">No GOAT fan yet</div>
            <div class="fan-gap">1 vote claims it. That's an invitation, not an empty state.</div>
          </div>`;
      }

      const row=document.createElement('div'); row.className=`board-row ${cls}`;
      row.dataset.personId=p.id;
      row.innerHTML=`
        <div class="rank-badge">#${rank}</div>
        <div class="row-left">
          <div class="person-photo">${photoHtml}</div>
          <div class="meta">
            <div class="name display">${p.name}</div>
            <div class="blurb">${p.blurb||''}</div>
            <div class="board-count display">$${Math.floor((p.total_cents||0)/100).toLocaleString('en-US')}</div>
            <div class="board-share">${sharePct(p)}% of the money on this board</div>
            <div class="board-bar"><div class="board-bar-fill" style="width:${Math.max(sharePct(p),1.5)}%"></div></div>
            <div class="gap">${gapText}</div>
          </div>
        </div>
        <div class="row-divider"></div>
        <div class="row-right">${fanHtml} <a href="/person?slug=${p.slug}#fans" style="margin-left:auto;font-size:11px;color:var(--gold);text-decoration:underline;white-space:nowrap">Report</a></div>
        <div class="row-actions">
          <span class="stepper"><button data-dec aria-label="Decrease">−</button><input data-amt-input type="number" min="1" value="1" style="width:56px;text-align:center;background:transparent;border:none;color:var(--ink);font-weight:700;font-size:12px;font-family:JetBrains Mono"><span data-amt style="display:none">$1</span><button data-inc aria-label="Increase">+</button></span>
          <button class="btn-back back-btn" data-back style="min-height:44px;min-width:44px">Back ${shortName(p.name)}</button>
          <span class="stakes" data-stakes>1 vote → #${rank}</span>
        </div>
        <div class="row-goat" data-goat-slot></div>`;

      // stepper
      let amt=100;
      const amtEl=row.querySelector('[data-amt]'), amtInput=row.querySelector('[data-amt-input]'), stakesEl=row.querySelector('[data-stakes]');
      function setAmt(v){ v=Math.max(1,Math.min(100000,Math.floor(v)||1)); amt=v*100; if(amtInput) amtInput.value=v; if(amtEl) amtEl.textContent=`$${v.toLocaleString('en-US')}`; }
      function updateStakes(){
        const v=Math.floor(amt/100);
        if(amtEl) amtEl.textContent=`$${v.toLocaleString('en-US')}`;
        if(amtInput && document.activeElement!==amtInput) amtInput.value=v;
        const newTotal=(p.total_cents||0)+amt;
        let newRank=1;
        for(let j=0;j<people.length;j++){
          if(people[j].id===p.id) continue;
          if((people[j].total_cents||0) > newTotal) newRank++;
          else if((people[j].total_cents||0)===newTotal && people[j].first_backed_at && p.first_backed_at && new Date(people[j].first_backed_at) < new Date(p.first_backed_at)) newRank++;
          else break;
        }
        stakesEl.textContent=`$${v.toLocaleString('en-US')} → #${newRank}`;
        if(rank===1) stakesEl.textContent=`$${v.toLocaleString('en-US')} → $${Math.floor(newTotal/100).toLocaleString('en-US')}`;
      }
      row.querySelector('[data-dec]').addEventListener('click',()=>{ setAmt(Math.max(1,Math.floor(amt/100)-1)); updateStakes(); });
      row.querySelector('[data-inc]').addEventListener('click',()=>{ setAmt(Math.min(100000,Math.floor(amt/100)+1)); updateStakes(); });
      if(amtInput){ amtInput.addEventListener('input',()=>{ setAmt(amtInput.value); updateStakes(); }); amtInput.addEventListener('change',()=>{ setAmt(amtInput.value); updateStakes(); }); }
      updateStakes();

      // The #1 fan spot, priced. Filled in after the row is on screen so a
      // board of a hundred contenders is not a hundred blocking queries before
      // anything paints. Same control code as the contender page, so the price
      // of the crown is computed once and cannot read differently in two places.
      (async function(){
        const slot = row.querySelector('[data-goat-slot]');
        if(!slot || !window.GoatBack) return;
        const g = await window.GoatBack.goatFan(p.id);
        if(g.isTop){
          slot.innerHTML = `<div class="goat-fan-card"><span class="goat-fan-crown">👑</span><div>
            <div class="goat-fan-title">You are ${esc(p.name)}'s Greatest Fan</div>
            <div class="goat-fan-sub mono">${window.GoatBack.usd(window.GoatBack.dollars(g.myTotal))} down — back again to defend it</div></div></div>`;
          return;
        }
        slot.innerHTML = `<button type="button" class="goat-fan-btn"><span class="goat-fan-crown">👑</span>
          <span class="goat-fan-copy">
            <span class="goat-fan-title">Become ${esc(p.name)}'s Greatest Fan of All Time</span>
            <span class="goat-fan-sub mono">${g.topName ? esc(g.topName)+' leads with '+window.GoatBack.usd(window.GoatBack.dollars(g.topTotal)) : 'Nobody has backed this one yet'}</span>
          </span>
          <span class="goat-fan-price">${window.GoatBack.usd(g.need)}</span></button>`;
        slot.querySelector('button').addEventListener('click', async () => {
          const btn = slot.querySelector('button');
          btn.disabled = true;
          const r = await window.GoatBack.place(p.id, g.need, {
            personName: p.name,
            personPhoto: window.GOAT?.getPhotoUrl?.(p.photo_path),
            onBacked(data){ if(data && typeof data.new_total === 'number') p.total_cents = data.new_total; }
          });
          btn.disabled = false;
          if(r){ await fetchPeople(); await render(); }
        });
      })();

      // Vote with optimistic UI — update number and reorder in place immediately
      row.querySelector('[data-back]').addEventListener('click', async()=>{
        const btn=row.querySelector('[data-back]'); const v=Math.floor(amt/100);
        // A name and an email before any money moves. place_vote refuses
        // without them anyway; asking here turns that into a form.
        if(window.GoatProfile && !(await window.GoatProfile.require())) return;
        // anon session check — if no auth, create anon session cookie later (optimistic still works)
        // optimistic: bump total locally
        const prevTotal=p.total_cents;
        const prevBalanceText=document.getElementById('sticky-balance')?.textContent;
        p.total_cents = (p.total_cents||0) + amt;
        // re-sort people by total_cents desc, first_backed_at asc
        people.sort(boardOrder);
        // optimistic balance tick (if header present)
        await render();
        // sticky highlight: flash
        row.style.outline='2px solid var(--gold)';
        setTimeout(()=> row.style.outline='', 600);
        btn.disabled=true; btn.textContent='…';
        // Same frame as the person page and the wallet: one place where votes
        // are cast and votes are bought.
        if(window.GoatCheckout){
          p.total_cents = prevTotal;
          await render();
          btn.disabled=false; btn.textContent='Vote';
          return window.GoatCheckout.vote({
            personId: p.id, personName: p.name, votes: v,
            personPhoto: window.GOAT?.getPhotoUrl?.(p.photo_path),
            onVoted(r){
              if(r && typeof r.new_total === 'number') p.total_cents = r.new_total;
              people.sort(boardOrder);
              render();
            }
          });
        }
        try{
          let data, error;
          try{
            const r=await sb.rpc('place_vote', {p_person_id: p.id, p_votes: v});
            data=r.data; error=r.error;
            if(error && String(error.message).includes('Could not find function')) throw error;
          }catch(e){
            if(String(e.message||e).includes('Could not find function') || String(e.message||'').includes('place_vote')){
              const r2=await sb.rpc('place_bid', {p_person_id: p.id, p_amount_cents: v*100});
              data=r2.data; error=r2.error;
            } else throw e;
          }
          if(error) throw error;
          // reconcile: use server total
          if(data && data.new_total) p.total_cents = data.new_total;
          if(data && data.balance!==undefined) {
            const pill=document.getElementById('balance-pill');
            if(pill) pill.innerHTML=`<b>${window.GOAT.money(data.balance)}</b> <a href="/wallet">Add credit</a>`;
            const sb2=document.getElementById('sticky-balance');
            if(sb2) sb2.innerHTML=`<b>${window.GOAT.money(data.balance)}</b>`;
          }
          await fetchPeople(); await render(); await window.refreshBalance();
          // post-vote: You're now X's #Y fan — claim spot
          const myRank = people.findIndex(x=>x.id===p.id)+1;
          setTimeout(()=> {
            window.goatToast(`You're now <b>${p.name}</b>'s #${myRank} backer.`);
          }, 300);
        }catch(e){
          // rollback
          p.total_cents = prevTotal;
          people.sort(boardOrder);
          await render();
          if(String(e.message||'').toLowerCase().includes('not enough') && window.GoatCheckout){
            window.GoatCheckout.open({ personId: p.id, personName: p.name,
              personPhoto: window.GOAT?.getPhotoUrl?.(p.photo_path) });
          } else {
            alert(e.message);
          }
          btn.disabled=false; btn.textContent='Vote';
        }
      });

      row.addEventListener('click', ev=>{ if(ev.target.closest('button') || ev.target.closest('.stepper') || ev.target.closest('input') || ev.target.closest('a')) return; location.href=`/person?slug=${p.slug}`; });
      board.appendChild(row);
    });

    // Fill in portraits for anyone whose photo_path is still empty.
    if(window.PortraitFallback) window.PortraitFallback.scan(board);

    // sticky balance sync
    const sbBal=document.getElementById('sticky-balance');
    if(sbBal){
      const {data:{user}}=await sb.auth.getUser();
      if(user){
        const {data}=await sb.from('users').select('balance_cents').eq('id', user.id).maybeSingle();
        sbBal.innerHTML=`<b>${window.GOAT.money(data?.balance_cents||0)}</b>`;
      } else {
        // anon session cookie read
        const m=document.cookie.match(/goat_anon=([^;]+)/);
        sbBal.textContent = m ? '— (anon)' : '$0';
      }
    }
  }

  document.getElementById('add-btn').addEventListener('click', async()=>{
    const name=document.getElementById('add-name').value.trim();
    if(!name) return alert('Enter a name — must have a Wikipedia entry.');
    const {data:{user}}=await sb.auth.getUser();
    if(!user) return location.href="/wallet";
    try{
      const {data: person, error: addErr}=await sb.rpc('add_person', {p_category_id: cat.id, p_name: name, p_blurb:'', p_wikipedia_url:`https://en.wikipedia.org/wiki/${encodeURIComponent(name.replace(/ /g,'_'))}`, p_photo_path: null});
      if(addErr) throw addErr;
      const pid=person;
      let _err=null;
      try{
        const r=await sb.rpc('place_vote', {p_person_id: pid, p_votes: 1});
        _err=r.error;
        if(_err && String(_err.message).includes('Could not find function')) throw _err;
      }catch(e){
        if(String(e.message||e).includes('Could not find function') || String(e.message||'').includes('place_vote')){
          const r2=await sb.rpc('place_bid', {p_person_id: pid, p_amount_cents: 100});
          _err=r2.error;
        } else throw e;
      }
      if(_err) throw _err;
      location.reload();
    }catch(e){ alert(e.message); }
  });

  // Restoring a line the .html-stripping rebrand cut in half: everything after
  // location.href="/" was lost, which pulled the awaits below into this
  // non-async arrow function. That made the whole script a syntax error, so
  // nothing on this page ran and every board came up blank.
  document.getElementById('search').addEventListener('keydown', e=>{
    if(e.key==='Enter') location.href = '/?q=' + encodeURIComponent(e.target.value);
  });

  await fetchPeople();
  await render();

  // realtime with throttle 500ms
  let pending=false;
  function throttledRender(){ if(pending) return; pending=true; setTimeout(async()=>{ pending=false; await fetchPeople(); await render(); }, 500); }
  try{ sb.channel('people-'+slug).on('postgres_changes',{event:'INSERT',schema:'public',table:'bids'}, throttledRender).subscribe();
       sb.channel('people-people-'+slug).on('postgres_changes',{event:'UPDATE',schema:'public',table:'people'}, throttledRender).subscribe(); }catch{}
})();
