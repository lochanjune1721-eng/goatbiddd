<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Person — The True GOAT</title>
<link rel="preconnect" href="https://orzcszqpnvicreqvpncu.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="stylesheet" href="css/style.css?v=16x9_v9">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="/">The True<span> GOAT</span></a></div>
  <div class="search"><i>⌕</i><input id="search" placeholder="Search"></div>
  <nav class="topnav"><a href="/">Categories</a><a href="/fans">Fans</a><a href="/about">About</a><span id="balance-pill" class="balance-pill"></span></nav>
</div></header>

<div class="container" style="padding:16px 20px;max-width:840px">
  <div id="person-head" class="job-card" style="display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:22px;align-items:start">
    <div id="photo-wrap" class="photo" style="width:100%;max-width:320px;aspect-ratio:1/1;border-radius:18px">
      <div class="fallback skeleton" style="width:100%;height:100%"></div>
    </div>
    <div>
      <div id="crumb" class="mono" style="font-size:12px;color:var(--muted)"></div>
      <h1 id="name" class="display" style="font-size:42px;line-height:1;margin-top:4px">—</h1>
      <div id="blurb" style="color:var(--muted);margin-top:6px;font-size:14px"></div>
      <!-- Same three pieces as a duel side and a board row: the count, the
           share under it, the bar. -->
      <div style="margin-top:16px">
        <div id="total" class="person-hero-count">0</div>
        <div id="hero-share" class="person-hero-share"></div>
        <div class="person-hero-bar"><div id="hero-bar" class="person-hero-bar-fill" style="width:0%"></div></div>
        <div id="rank" class="mono" style="font-size:13px;color:var(--muted);margin-top:10px"></div>
      </div>
      <div class="back-row" id="back-row" style="margin-top:14px"></div>
      <div id="wiki" class="mono" style="font-size:11px;color:var(--muted);margin-top:12px"></div>
    </div>
  </div>

  <div id="outbid-card" class="job-card" style="display:none;margin-top:16px;border-color:var(--gold)"></div>

  <h2 class="display" style="font-size:22px;margin:24px 0 12px">Top fans — #1 is the Greatest Fan of All Time <span style="font-size:11px;color:var(--gold);font-family:Inter;margin-left:4px">LIVE</span></h2>
  <div id="fans" class="list"><div class="skeleton" style="height:96px;border-radius:12px"></div></div>
</div>

<footer class="footer">The True GOAT — pay to rank. <a href="/rules">Rules</a> · <a href="/wallet">Wallet</a> · <a href="/fans">Fans</a></footer>

<script src="js/supabase.js"></script>
<script src="js/checkout.js"></script>
<script src="js/profile.js"></script>
<script src="js/back-control.js"></script>
<script src="js/video-manager.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/portrait-fallback.js"></script>
<script src="js/video-hover.js?v=single_audio_v5"></script>
<script>
(async function(){
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  const slug=window.GOAT.qs('slug');
  if(!slug){ document.getElementById('name').textContent='Missing ?slug='; return; }
  const sb=window.supabaseClient;
  const {data: person}=await sb.from('people').select('*, categories(name,slug,group_name)').eq('slug',slug).maybeSingle();
  if(!person){ document.getElementById('name').textContent='Not found'; return; }
  document.title=person.name+' — The True GOAT';
  document.getElementById('name').textContent=person.name;
  document.getElementById('blurb').textContent=person.blurb||'';
  paintHero();
  if(person.categories){
    document.getElementById('crumb').innerHTML=`<a href="/category?slug=${person.categories.slug}" style="color:var(--gold)">${person.categories.name}</a> · ${person.categories.group_name}`;
  }

  // Load hero photo with eager high priority
  const photoWrap = document.getElementById('photo-wrap');
  photoWrap.innerHTML = window.PortraitFallback.photoHtml(person, 320, {eager:true});
  window.PortraitFallback.scan(photoWrap);

  // Parallel rank and fan query
  let fans = [];
  // The hero's three pieces move together: the count, the share of the board,
  // and the bar. Six places used to set the count alone.
  let catTotalCents = 0;
  function paintHero(){
    const cents = person?.total_cents || 0;
    const el = document.getElementById('total');
    if(el) el.textContent = Math.floor(cents/100).toLocaleString();
    const pct = catTotalCents > 0 ? Math.round((cents / catTotalCents) * 1000) / 10 : 0;
    const share = document.getElementById('hero-share');
    if(share) share.innerHTML = catTotalCents > 0
      ? '<b>' + pct + '%</b> of every vote on this board'
      : 'First vote takes #1';
    const bar = document.getElementById('hero-bar');
    if(bar) bar.style.width = Math.max(pct, catTotalCents > 0 ? 1.5 : 0) + '%';
  }

  // Set once the backing control is mounted; the fan poll refreshes its price.
  let backControl = null;

  async function loadFansData(){
    try {
      const [catPeopleRes, fansRes] = await Promise.all([
        person.category_id ? sb.from('people').select('id,total_cents,first_backed_at,seed_rank').eq('category_id', person.category_id).order('total_cents',{ascending:false}).order('first_backed_at',{ascending:true,nullsFirst:false}).order('seed_rank',{ascending:true,nullsFirst:false}) : Promise.resolve({data:[]}),
        sb.from('fan_totals').select('total_cents,users(id,display_name,is_anonymous,photo_path,social_handle,social_platform,photo_status)').eq('person_id', person.id).order('total_cents',{ascending:false}).limit(100)
      ]);

      const catPeople = catPeopleRes?.data || [];
      const rank = catPeople.findIndex(p => p.id === person.id) + 1 || '—';
      catTotalCents = catPeople.reduce((n,x)=> n + (x.total_cents||0), 0);
      paintHero();
      document.getElementById('rank').textContent = `#${rank} in ${person.categories?.name || 'Category'}`;
      if(person.wikipedia_url) {
        document.getElementById('wiki').innerHTML = `<a href="${person.wikipedia_url}" target="_blank" rel="noopener" style="text-decoration:underline">Wikipedia</a> ${person.photo_credit? '· '+person.photo_credit:''}`;
      }

      fans = fansRes?.data || [];
      renderFans(fans);
      if(backControl) backControl.refresh();
    } catch(e) {
      console.warn('Fans load error:', e);
    }
  }

  function renderFans(list){
    const el=document.getElementById('fans');
    if(!list||!list.length) {
      el.innerHTML=`<div class="empty">No backers yet. Be the first with $1 — your face becomes crowned as ${esc(person.name)}'s #1 Fan!</div>`;
      return;
    }
    el.innerHTML=list.map((f,i)=>{
      const u=f.users||{};
      const name = u.is_anonymous ? 'Anonymous' : (u.display_name||'Unknown');
      const handle = u.social_handle ? `<a href="https://${u.social_platform==='instagram'?'instagram.com':'x.com'}/${encodeURIComponent(u.social_handle.replace(/^@/,''))}" target="_blank" rel="noopener" style="color:var(--gold);font-size:11px">@${u.social_handle.replace(/^@/,'')}</a>` : '';
      const initials = window.GOAT.initials(name);
      const photoUrl = u.photo_path ? (window.GOAT.getPhotoUrl(u.photo_path)||u.photo_path) : null;
      const photo = photoUrl ? `<img src="${photoUrl}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">` : `<div style="width:44px;height:44px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;color:var(--gold);font-family:Anton,sans-serif">${initials}</div>`;
      const crown = i===0 ? '👑 ' : '';
      const count = window.GOAT.money(f.total_cents);
      return `<div class="job-card" style="display:flex;gap:12px;align-items:center;padding:12px 14px;${i===0?'border-color:var(--gold);background:linear-gradient(180deg, var(--gold-lo) 0%, var(--surface) 60%);':''}">
        <div style="font-family:JetBrains Mono,monospace;font-size:13px;color:var(--muted);width:28px;text-align:center;font-weight:700">${i===0?'👑':'#'+(i+1)}</div>
        <div style="width:44px;height:44px;border-radius:50%;overflow:hidden;flex:0 0 auto">${photo}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${crown}${name}${i===0?' <span style="font-size:11px;color:var(--gold);margin-left:4px">— Greatest Fan of All Time</span>':''}</div>
          <div style="font-size:11px;color:var(--muted)">${handle || 'Supporter'} · <a href="#" onclick="event.preventDefault(); alert('Reported for review.');" style="color:var(--muted);text-decoration:underline">Report</a></div>
        </div>
        <b class="display" style="color:var(--gold);font-size:18px">${count}</b>
      </div>`;
    }).join('');
  }

  // === BACKING ===
  //
  // One control for all three ways to put money on this contender: a dollar,
  // any amount typed in, or the exact price of the #1 fan spot. It lives in
  // js/back-control.js and is the same control the boards and the homepage
  // use, so the price of the crown cannot read differently in two places.
  //
  // It replaces the old stepper and the separate outbid card, which computed
  // that price themselves and could disagree with each other after a vote.
  const outbidCard = document.getElementById('outbid-card');
  if(outbidCard) outbidCard.style.display = 'none';

  async function mountBacking(){
    const row = document.getElementById('back-row');
    if(!row || !window.GoatBack) return;
    backControl = await window.GoatBack.mount(row, {
      personId: person.id,
      personName: person.name,
      personPhoto: window.GOAT?.getPhotoUrl?.(person.photo_path),
      getTotal: () => person.total_cents,
      onBacked(data){
        if(data && typeof data.new_total === 'number') person.total_cents = data.new_total;
        paintHero();
        loadFansData();
      }
    });
  }
  await loadFansData();
  await mountBacking();

  // Polling for live fan updates
  setInterval(loadFansData, 4000);
})();
</script>
</body>
</html>
