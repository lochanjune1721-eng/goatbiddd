<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GOAT.lol — Who's the greatest?</title>
<meta name="description" content="Fans buy credit, then spend it backing whoever they believe in. The money is the ranking.">
<link rel="preconnect" href="https://iuvmzlrnbwptgrbkdbbn.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
    <div class="search"><i>⌕</i><input id="search" placeholder="Search people, categories"></div>
    <nav class="topnav">
      <a href="index.html" class="active">Categories</a>
      <a href="fans.html">Fans</a>
      <a href="about.html">About</a>
      <span id="balance-pill" class="balance-pill"><a href="wallet.html">Sign in</a></span>
    </nav>
  </div>
</header>

<div class="container">
  <div class="live-pill"><span class="live-dot"></span> <span id="online">— online</span> · <span id="backed-today">$0 backed today</span></div>

  <div class="hero">
    <h1 class="display">Who's the greatest?</h1>
    <p>Every argument is free. This one isn't. Load $5, back who you believe in — the board is the money, nothing else.</p>
  </div>

  <div id="groups"></div>

  <div id="unclaimed" class="unclaimed" style="display:none"></div>

  <div style="margin:20px 0">
    <h2 class="display" style="font-size:18px">Live activity</h2>
    <div id="activity" class="activity"></div>
  </div>
</div>

<footer class="footer">GOAT.lol — pay to rank. <a href="rules.html">Rules</a> · <a href="wallet.html">Wallet</a> · <a href="fans.html">Fans</a></footer>

<script src="js/supabase.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/wiki-fallback.js"></script>
<script>
(async function(){
  const sb=window.supabaseClient;
  const groupsEl=document.getElementById('groups'), unclaimedEl=document.getElementById('unclaimed'), activityEl=document.getElementById('activity');
  const search=document.getElementById('search');
  if(search){
    search.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const q=e.target.value.trim(); if(q) location.href='category.html?slug='+encodeURIComponent(q); }});
  }

  // Clear old stale cache
  try {
    localStorage.removeItem('goat_home_cache');
    localStorage.removeItem('goat_home_cache_v2');
  } catch(e) {}

  let cats = [];
  let people = [];

  try {
    const [catsRes, p0, p1, p2, p3, p4, p5] = await Promise.all([
      sb.from('categories').select('*').order('sort_order'),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(0, 999),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(1000, 1999),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(2000, 2999),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(3000, 3999),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(4000, 4999),
      sb.from('people').select('id,slug,name,photo_path,total_cents,category_id,first_backed_at').order('total_cents',{ascending:false}).range(5000, 5999)
    ]);
    cats = catsRes?.data || [];
    people = [
      ...(p0?.data || []),
      ...(p1?.data || []),
      ...(p2?.data || []),
      ...(p3?.data || []),
      ...(p4?.data || []),
      ...(p5?.data || [])
    ];
  } catch(e) {
    console.warn('DB fetch error:', e);
  }

  // Fallback if DB empty
  if((!cats || !cats.length) || (!people || !people.length)){
    const fallback = await window.WIKI_FALLBACK?.();
    if(fallback){
      if(!cats || !cats.length) cats = fallback.categories.map((c,i)=>({id:'fallback-'+c.slug, slug:c.slug, name:c.name, group_name:c.group, sort_order:i}));
      if(!people || !people.length){
        const idBySlug={}; cats.forEach(c=> idBySlug[c.slug]=c.id);
        people = fallback.people.map(p=>({id:p.id, slug:p.slug, name:p.name, photo_path:p.photo_path, total_cents:0, category_id:idBySlug[p.category_slug]||cats[0].id, first_backed_at:null}));
      }
    }
  }

  function renderHomepage(cats, people) {
    if(!cats || !cats.length) return;
    
    // Pre-index people by category_id for instant lookups
    const peopleByCat = {};
    for(const p of (people || [])){
      if(!peopleByCat[p.category_id]) peopleByCat[p.category_id] = [];
      peopleByCat[p.category_id].push(p);
    }

    // Group categories
    const groupMap = {};
    cats.forEach(c => {
      const grp = c.group_name || 'Other';
      if(!groupMap[grp]) groupMap[grp] = [];
      groupMap[grp].push(c);
    });

    // Sort groups by total money
    const groupTotals = {};
    Object.keys(groupMap).forEach(g => {
      const ids = groupMap[g].map(c => c.id);
      groupTotals[g] = ids.reduce((sum, cid) => {
        const pList = peopleByCat[cid] || [];
        return sum + pList.reduce((s, p) => s + (p.total_cents || 0), 0);
      }, 0);
    });
    const sortedGroups = Object.keys(groupMap).sort((a,b) => groupTotals[b] - groupTotals[a]);

    groupsEl.innerHTML = '';
    let tileIndex = 0;

    for(const g of sortedGroups){
      const groupCats = groupMap[g];
      const section = document.createElement('div');
      section.className = 'group';
      section.innerHTML = `<div class="group-head"><h2>${g}</h2><span class="mono" style="font-size:11px;color:var(--muted)">${groupCats.length} boards</span></div><div class="cat-grid"></div>`;
      const grid = section.querySelector('.cat-grid');

      for(const cat of groupCats){
        const catPeople = peopleByCat[cat.id] || [];
        const p1 = catPeople[0], p2 = catPeople[1];
        const tile = document.createElement('a');
        tile.href = `category.html?slug=${cat.slug}`;
        tile.className = 'cat-tile';

        const priority = tileIndex < 6 ? 'eager' : 'lazy';
        tileIndex++;

        const p1Photo = p1 ? window.OptimizedImage.render({ photoPath: p1.photo_path, name: p1.name, size: 120, priority, slug: p1.slug }) : '<div class="fallback">?</div>';
        const p2Photo = p2 ? window.OptimizedImage.render({ photoPath: p2.photo_path, name: p2.name, size: 80, priority, slug: p2.slug }) : '<div class="fallback" style="font-size:16px">?</div>';
        const gap = p1 && p2 ? `$${(((p1.total_cents||0) - (p2.total_cents||0))/100).toFixed(0)} ahead` : p1 ? '—' : '$1 takes it';

        tile.innerHTML = `
          <div class="cat-tile-head"><strong>${cat.name}</strong><span>${catPeople.length} people</span></div>
          <div class="cat-tile-body">
            <div class="p1">
              <div class="photo">${p1Photo}</div>
              <div class="meta">
                <div class="name display">${p1 ? p1.name : 'Empty'}</div>
                <div class="total display">${p1 ? window.GOAT.cents(p1.total_cents||0) : '$0'}</div>
                <div class="gap">${gap}</div>
              </div>
            </div>
            <div class="p2">
              <div class="photo" style="border-radius:12px">${p2Photo}</div>
              <div class="meta">
                <div class="name" style="font-size:12px;font-weight:600">${p2 ? p2.name : '—'}</div>
                <div class="total" style="font-size:13px">${p2 ? window.GOAT.cents(p2.total_cents||0) : ''}</div>
              </div>
            </div>
          </div>
          <div class="cat-tile-foot"><span>${p1 ? window.GOAT.cents(p1.total_cents||0)+' total' : 'Unclaimed'}</span><span>View board →</span></div>`;
        grid.appendChild(tile);
      }
      groupsEl.appendChild(section);
    }
  }

  // Initial render with fresh data
  renderHomepage(cats, people);


  // Unclaimed banner
  const emptyCats = cats.filter(c => !(peopleByCat[c.id] && peopleByCat[c.id].length));
  if(emptyCats.length && unclaimedEl){
    unclaimedEl.style.display = 'block';
    unclaimedEl.innerHTML = `<strong>${emptyCats.length} boards where #1 is still open. $1 takes it.</strong> <span class="mono" style="font-size:12px;color:var(--muted)">Most boards will be empty at launch — that's an offer, not a graveyard.</span>`;
  }

  // Asynchronous secondary data (bids / activity)
  try {
    const today = new Date(); today.setHours(0,0,0,0);
    const [todayBidsRes, activityBidsRes] = await Promise.all([
      sb.from('bids').select('amount_cents').gte('created_at', today.toISOString()),
      sb.from('bids').select('amount_cents,created_at,people(name,slug),users(display_name,is_anonymous)').order('created_at',{ascending:false}).limit(10)
    ]);
    const backedToday = (todayBidsRes.data || []).reduce((s,r) => s + (r.amount_cents || 0), 0);
    const backedEl = document.getElementById('backed-today');
    if(backedEl) backedEl.textContent = window.GOAT.cents(backedToday) + ' backed today';

    const bids = activityBidsRes.data;
    if(activityEl){
      if(bids && bids.length){
        activityEl.innerHTML = bids.map(b => {
          const handle = b.users?.is_anonymous ? 'Anonymous' : (b.users?.display_name || 'Someone');
          return `<div><b>${handle}</b> put ${window.GOAT.cents(b.amount_cents)} on <a href="person.html?slug=${b.people?.slug}" style="color:var(--gold)">${b.people?.name}</a> · ${window.GOAT.fmtAgo(b.created_at)}</div>`;
        }).join('');
      } else {
        activityEl.innerHTML = '<div class="mono" style="color:var(--muted)">No activity yet. Be the first.</div>';
      }
    }
  } catch(e) {
    if(activityEl) activityEl.innerHTML = '<div class="mono" style="color:var(--muted)">No activity yet. Be the first.</div>';
  }

  // Realtime subscription
  try {
    sb.channel('bids-index').on('postgres_changes', {event:'INSERT', schema:'public', table:'bids'}, async () => {
      location.reload();
    }).subscribe();
  } catch(e) {}
})();
</script>
</body>
</html>
