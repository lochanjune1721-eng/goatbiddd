# Deploys thetruegoat.com on every push to main.
#
# This exists because "is it live yet?" kept being the actual bug. A push is
# not a deploy: wrangler has to run, and until it does the site keeps serving
# the previous build however many times the code is fixed. Several rounds of
# "still can't see it" were that and nothing else.
#
# ── One-time setup ─────────────────────────────────────────────────────────
#
# Add one repository secret and every push goes live by itself from then on:
#
#   1. https://dash.cloudflare.com/profile/api-tokens → Create Token
#      → "Edit Cloudflare Workers" template → Continue → Create Token → copy it.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions
#      → New repository secret → name CLOUDFLARE_API_TOKEN → paste → Add.
#
# If the token can see more than one Cloudflare account, add a second secret
# CLOUDFLARE_ACCOUNT_ID with the account id from the Cloudflare dashboard URL.
#
# Until the secret exists this job passes and says so rather than failing, so
# it never sits red on the commit list. Deploy by hand meanwhile with
# `npx wrangler deploy`.
#
# Safe to keep even if Cloudflare is already building this repo on push — the
# second deploy uploads the identical build and the site does not notice.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes one still deploying, so the last commit wins rather
# than whichever upload happens to finish last.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall runs scripts/build-assets.mjs, which assembles public/ —
      # the only directory wrangler uploads.
      - name: Install and build
        run: npm ci

      - name: Check the site was assembled
        run: |
          test -f public/index.html || { echo "public/index.html missing — the build did not run"; exit 1; }
          echo "public/ holds $(find public -type f | wc -l) files"

      # Fast and hermetic — no browser, no network. It covers the badge's data
      # path, which is where every "the face is not showing" round has landed.
      - name: Test
        run: npm test

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      - name: Say what to do instead
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          {
            echo "### Not deployed — CLOUDFLARE_API_TOKEN is not set"
            echo
            echo "The build is fine; nothing uploaded it. To make every push deploy itself:"
            echo
            echo "1. Create a token at <https://dash.cloudflare.com/profile/api-tokens> using the"
            echo "   **Edit Cloudflare Workers** template."
            echo "2. Add it here as **CLOUDFLARE_API_TOKEN** under Settings → Secrets and variables → Actions."
            echo
            echo 'Until then, deploy by hand with `npx wrangler deploy`.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CLOUDFLARE_API_TOKEN is not set — built but did not deploy. See the job summary."
